<!DOCTYPE html>

<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Choco Fábrica GT3 RS - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #3b0a45, #6a0572, #a4508b);
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: linear-gradient(90deg, #4b0082, #8a2be2);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffd700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 24px;
            font-family: 'Pacifico', cursive;
            color: #ffd700;
        }

        .menu a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(255,215,0,0.15);
        }

        /* CONTEÚDO */
        .container {
            padding: 40px;
        }

        .title {
            font-size: 26px;
            margin-bottom: 20px;
            color: #fff;
        }

        .user-info {
            color: #fff;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 320px;
        }

        .card {
            background: linear-gradient(145deg, #5a2a27, #3e1f1c);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: 0.3s;
            border: 2px solid #ffd70033;
            cursor: pointer;
        }

        .card:hover {
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .card h3 {
            color: #ffd700;
        }

        .card p {
            font-size: 14px;
            color: #f5e6d3;
        }

        .alert {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            color: #fff;
        }
    </style>


</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
    <div class="logo">Choco Fábrica GT3 RS</div>


    <div class="menu">
        <a th:href="@{/logout}">Logout</a>
    </div>


</div>

<!-- CONTEÚDO -->

<div class="container">


    <div class="title">🍫 Bem-vindo à Choco Fábrica GT3 RS</div>

    <!-- INFO DO USUÁRIO -->
    <div class="user-info">
        👤 Usuário: <span sec:authentication="name"></span><br>
    </div>

    <div class="cards">

        <!-- ADMIN -->
        <div sec:authorize="hasRole('ADMIN')">

            <a th:href="@{/usuarios/deletar}">
                <div class="card">
                    <h3>🗑️ Deletar Usuário</h3>
                    <p>Remova usuários do sistema.</p>
                </div>
            </a>

            <a th:href="@{/usuarios/alterar}">
                <div class="card">
                    <h3>✏️ Alterar Usuário</h3>
                    <p>Edite dados já cadastrados.</p>
                </div>
            </a>

        </div>

        <!-- USER -->
        <div sec:authorize="hasRole('USER')">
            <div class="alert">
                ⚠️ Você possui acesso limitado.<br>
                Apenas administradores podem gerenciar usuários.
            </div>
        </div>

    </div>


</div>

</body>
</html>
