<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #3b0a45, #6a0572, #a4508b);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: linear-gradient(145deg, #5a2a27, #3e1f1c);
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .logo {
            font-size: 26px;
            font-family: 'Pacifico', cursive;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #f5e6d3;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            font-size: 13px;
            color: #ffd700;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 10px;
            border: 1px solid #ffd70055;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(90deg, #ffd700, #ffb300);
            color: #4b0082;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .error { color: #ff6b6b; }
        .success { color: #4caf50; }
    </style>
</head>

<body>

<div class="container">
    <div class="logo">Choco Fábrica 🍫</div>
    <div class="subtitle">Cadastro de usuário</div>

    <div th:if="${erro}" class="error" th:text="${erro}"></div>

    <form th:action="@{/cadastro}" method="post">

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="input-group">
            <label>Senha</label>
            <input type="password" name="senha" required>
        </div>

        <button class="btn">Cadastrar</button>
    </form>

    <div class="register">
        Já tem conta?
        <a th:href="@{/login}">Login</a>
    </div>
</div>

</body>
</html>
