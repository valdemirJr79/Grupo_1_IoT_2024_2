<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #3b0a45, #6a0572, #a4508b);
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            background: linear-gradient(90deg, #4b0082, #8a2be2);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffd700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 24px;
            font-family: 'Pacifico', cursive;
            color: #ffd700;
        }

        .menu a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(255,215,0,0.15);
        }


        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 80px);
        }


        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .title {
            font-size: 26px;
            color: #fff;
            text-align: center;
        }

        .form-card {
            background: linear-gradient(145deg, #5a2a27, #3e1f1c);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 2px solid #ffd70033;
        }

        label {
            color: #ffd700;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: #ffd700;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ffcc00;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a th:href="@{/home}">
        <div class="logo">Choco Fábrica GT3 RS</div>
    </a>

    <div class="menu">
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>

<div class="container">

    <div class="content-box">

        <div class="title">✏️ Editar Usuário</div>

        <!-- 🔥 Mensagens -->
        <div th:if="${sucesso}" class="success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="error" th:text="${erro}"></div>

        <div class="form-card">
            <form th:action="@{/usuarios/alterar}" method="post">

                <label>Selecionar Usuário</label>
                <select name="id" required>
                    <option value="">-- Escolha --</option>
                    <option th:each="user : ${usuarios}"
                            th:value="${user.id}"
                            th:text="${user.email}">
                    </option>
                </select>

                <label>Novo Email</label>
                <input type="email" name="email" placeholder="Digite o novo email" required>

                <label>Nova Senha</label>
                <input type="password" name="senha" placeholder="Digite a nova senha">

                <button type="submit">Salvar Alterações</button>

            </form>
        </div>

    </div>

</div>

</body>
</html>
